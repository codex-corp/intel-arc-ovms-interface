name: Quality

on:
  push:
    branches:
      - master
      - refactor/**
      - feature/**
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r requirements-tui.txt

      - name: Python syntax
        run: python -m compileall -q proxy_server.py tools tests

      - name: TUI import smoke
        run: python -c "from tools.tui.app import ArcAiApp; print(ArcAiApp.TITLE)"

      - name: Python unit tests
        run: python tests/run_tests.py

      - name: PowerShell smoke checks
        shell: powershell
        run: .\tests\quality_smoke.ps1
