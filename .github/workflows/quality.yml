name: Quality

on:
  push:
    branches:
      - master
      - refactor/**
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install aiohttp==3.13.3

      - name: Python syntax
        run: python -m compileall -q proxy_server.py tools tests

      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: PowerShell smoke checks
        shell: powershell
        run: .\tests\quality_smoke.ps1
